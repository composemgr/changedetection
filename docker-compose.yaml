# nginx proxy address - http://172.17.0.1:5000

name: changedetection
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  app:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    pull_policy: always
    container_name: changedetection-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - changedetection
    ports:
      - "172.17.0.1:5000:5000"
    environment:
      TZ: ${TZ:-America/New_York}
      BASE_URL: http://${BASE_HOST_NAME:-localhost}:5000
      PLAYWRIGHT_DRIVER_URL: ws://changedetection-playwright:3000/
    volumes:
      - ./volumes/data/changedetection:/datastore
    depends_on:
      - playwright
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  playwright:
    image: browserless/chrome:latest
    pull_policy: always
    container_name: changedetection-playwright
    hostname: changedetection-playwright
    restart: always
    logging: *default-logging
    networks:
      - changedetection
    environment:
      TZ: ${TZ:-America/New_York}
      SCREEN_WIDTH: 1920
      SCREEN_HEIGHT: 1024
      SCREEN_DEPTH: 16
      ENABLE_DEBUGGER: false
      PREBOOT_CHROME: true
      CONNECTION_TIMEOUT: 300000
      MAX_CONCURRENT_SESSIONS: ${PLAYWRIGHT_MAX_SESSIONS:-10}
      CHROME_REFRESH_TIME: 600000
      DEFAULT_BLOCK_ADS: true
      DEFAULT_STEALTH: true

networks:
  changedetection:
    name: changedetection
    external: false
